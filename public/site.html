<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFE4">
  <title>Confessionail Studio · 24-hour nails in Downtown LA</title>
  <meta name="description" content="Private luxury nail studio in the Historic Core, DTLA. Open 24 hours: walk in 9am to 8pm, book any hour after.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preload" href="/fonts/bodoni-moda-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <script>/* set the night look before first paint */(function(){var q=location.search;var h=+new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",hourCycle:"h23"}).format(new Date());if(/[?&]night/.test(q)||(!/[?&]day/.test(q)&&(h>=20||h<6)))document.documentElement.setAttribute("data-night","")})()</script>
</head>
<body>
  <header class="nav">
    <a class="wordmark" href="/" data-link>Confessionail</a>
    <nav>
      <a href="/#work" data-link>Work</a>
      <a href="/#artists" data-link>Artists</a>
      <a href="/locations" data-link>Visit</a>
    </nav>
    <a class="btn btn-small" id="book-top" href="#">Book</a>
  </header>
  <main id="page"></main>
  <footer class="foot" id="foot"></footer>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/site.js"></script>
</body>
</html>
