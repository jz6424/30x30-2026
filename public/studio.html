<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Set → Post">
  <title>Studio · Confessionail</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">C</span><div><div class="name">Confessionail</div><div class="sub" id="who">Studio</div></div></div>
    <div class="top-right">
    <nav class="tabs" hidden>
      <a href="#/upload" data-tab="upload">Upload</a>
      <a href="#/posts" data-tab="posts">Posts <span class="badge" id="badge" hidden></span></a>
      <a href="#/jobs" data-tab="jobs">Jobs <span class="badge" id="jobs-badge" hidden></span></a>
    </nav>
    <a href="#/admin" class="icon-btn" id="admin-btn" aria-label="Admin: team and locations" title="Admin" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></a>
    <button type="button" class="icon-btn" id="signout" aria-label="Sign out" title="Sign out" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></button>
    </div>
  </header>
  <div id="a2hs" class="hint" hidden>
    <span>Tap <b>Share</b>, then <b>Add to Home Screen</b> to open this like an app</span>
    <button class="link" id="a2hs-close">Got it</button>
  </div>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
